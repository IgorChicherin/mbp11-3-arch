# /etc/reclocked.conf — MacBook Pro 11,3, patched linux-lts-mbp. Desktop-agnostic: no Hyprland window rules.
# Based on upstream src/reclocked.conf (v5.13), tuned for this machine.
#
# Without Hyprland (hyprctl) the focused window class/title is always empty, so every
# window-class rule ([preferred], [caps], [low-power], [dgpu-hard], [dgpu-soft],
# [dgpu-idle], [igpu], [preferred-titles]) is inert and omitted here.

[profile default]
max-pstate = 07
temp-down = 85
temp-up = 78
boost-pstate = -1

[profile preferred]
max-pstate = 0e
temp-down = 85
temp-up = 78
boost-pstate = -1

[global]
interval-ms = 200
poll-ms = 1000
busy-up = 80
busy-down = 60
temp-dwell-ms = 5000
idle-dwell-ms = 1000
profile-dwell-ms = 2000
win-ms = 1000
exit-state = 0a
gr-idle-promille = 500

# Used in dGPU (DIS) mode: 07 deep idle / 0a baseline / 0e heavy. 0f never used.
# temp-per-profile=false: without hyprctl the daemon always lands on [profile default] (52 C up-threshold),
# which would block 0e forever — this GPU idles at 57-64 C, peaks 71-75 C at 0e.
[dgpu-active]
enable = true
baseline = 0a
max = 0e
low-power-ceiling = 0a
# none: idle dGPU drops to 07 even while you type (in iGPU mode the dGPU only
# renders offloaded apps, so keyboard/mouse activity says nothing about its load).
# Busy >= deep-idle-busy (20%) raises it to 0a, > busy-enter (80%) to 0e.
activity-source = none
activity-dwell-ms = 8000
deep-idle-busy = 20
busy-enter = 80
busy-exit = 40
temp-per-profile = false
temp-down = 85
temp-up = 78

# Fan curve vs hottest of CPU/dGPU. Quieter start than upstream:
# dGPU mode quiet below 60 C; iGPU mode quiet below 50 C (upstream: 33 C).
# Both reach full speed at 90 C (CPU "high" is 84 C).
[fan]
enable = true
temp-min = 60
temp-mid = 80
fan-mid = 60
temp-max = 90
temp-min-igd = 50
temp-mid-igd = 80
fan-mid-igd = 60
temp-max-igd = 90

# Case-temperature curve. Upstream (20..60 C, soak at 45 C for 5 min) ran fans at
# ~60-70% whenever the case was in its normal 40-48 C band.
# Now: quiet up to 40 C case, full at 60 C; soak only above 50 C, held 2 min.
[fan-case]
enable = true
keys = Ta0P, TaSP, Th1H, Th2H, Ts0S, Ts1S, TM0P, TP0P
case-min = 40
case-max = 60
soak-enter = 50
case-dwell-ms = 5000
hold-ms = 120000
hold-floor = curve
ramp-rpm-s = 150

# Off: forced 100% fans on every gcc/make/cargo run (incl. DKMS/AUR builds).
[compiler]
enable = false

# switchd: ON, patched linux-lts-mbp (with 0016) only. IGD topology: the dGPU is off while nothing uses it.
# backend runpm = nouveau runtime PM (/etc/modprobe.d/nouveau-runpm.conf gives runpm=1 on *-lts-mbp): the
# kernel wakes the dGPU when an app opens it (DRI_PRIME=1) and cuts its power through gmux 5-7 s after the
# last user; reclocked runs its power-on recovery on those wakes. `sudo reclockctl dgpu-on` holds it awake,
# `dgpu-auto` hands it back. [dgpu-procs] empty, cpu-temp-promote 0.
[switch]
enable = true
tick-ms = 1000
dwell-in-ms = 3000
dwell-out-ms = 1000
min-residence-ms = 1000
cooldown-ms = 1000
wait-ready-ms = 2000
min-switch-gap-ms = 1000
temp-gate = 82
busy-enter = 80
busy-exit = 40
title-idle-busy = 70
title-idle-hold-ms = 30000
class-idle-busy = 33
cpu-temp-gate = 70
cpu-temp-promote = 0
busy-idle-dwell-ms = 3000
pstate-settle-ms = 2000
pstate-write-timeout-ms = 2000

[dpower]
backend = runpm
autosuspend-ms = 5000
wait-idle-timeout-ms = 5000
wait-ready-timeout-ms = 10000

[dgpu-procs]
