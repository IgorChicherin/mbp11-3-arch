# Runtime PM for the GT 750M only on the patched kernel (linux-lts-mbp, patches 0006-0013): the dGPU
# powers off when unused and the kernel wakes it when a client opens it (DRI_PRIME=1).
# Stock kernels keep nouveau's default (runpm=-1, i.e. off on this Apple gmux machine): without the
# patches, powering the dGPU back on can hang the MacBookPro11,3.
install nouveau case "$(cat /proc/sys/kernel/osrelease)" in *-lts-mbp) o=runpm=1 ;; *) o= ;; esac; /usr/bin/modprobe --ignore-install nouveau $o $CMDLINE_OPTS
